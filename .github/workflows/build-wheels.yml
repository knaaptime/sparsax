name: Build and publish to PyPI

on:
  push:
    tags:
      - "v*" # v1.2.3 → PyPI, v1.2.3a1/b1/rc1 → TestPyPI
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    permissions:
      id-token: write # MANDATORY for trusted publishing to PyPI
      contents: write # MANDATORY for the GitHub release action
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 — manylinux via cibuildwheel's default container
          - os: ubuntu-latest
            arch: x86_64
          # Linux aarch64 — emulated via QEMU
          - os: ubuntu-latest
            arch: aarch64
          # macOS Apple Silicon (arm64) -- pinned rather than macos-latest.
          # SuiteSparse is now built from source honouring
          # MACOSX_DEPLOYMENT_TARGET, so the old reason (Homebrew bottles
          # embedding the host's minimum target) no longer applies and the
          # target below could be lowered to widen compatibility. Bump the
          # pin and the target deliberately, not automatically.
          - os: macos-15
            arch: arm64
            macosx_deployment_target: "15.0"
          # Windows x86_64 -- pinned rather than windows-latest, since
          # windows-latest now resolves to a windows-2025-vs2026 preview
          # image whose bundled flang compiler fails to compile reference
          # LAPACK's Fortran source (a compiler bug, not fixable here).
          # Bump this pin deliberately once VS2026/flang has matured.
          - os: windows-2022
            arch: AMD64
    runs-on: ${{ matrix.os }}
    env:
      CIBW_BUILD: "cp312-* cp313-* cp314-*"
      # jaxlib (needed at build time for XLA FFI headers) has no musllinux
      # wheels published at all -- only manylinux, macOS, and Windows. That's
      # an upstream gap, not something fixable from this workflow, so skip
      # musllinux targets entirely rather than let every build fail on it.
      CIBW_SKIP: "*-musllinux*"
      CIBW_ARCHS: ${{ matrix.arch }}
      CIBW_BUILD_VERBOSITY: 1
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_deployment_target }}

      # ── Linux ──────────────────────────────────────────────────────────────
      # The default manylinux2014 image is too old: jaxlib and scipy no
      # longer publish wheels for it, which forced pip to backtrack to
      # ancient jax versions and eventually build scipy from source (which
      # then failed on a missing OpenBLAS). Use manylinux_2_28 instead, which
      # is current enough for modern prebuilt wheels of everything involved.
      CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
      CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
      # ── macOS and Linux: SuiteSparse from source ───────────────────────────
      # ci/build_suitesparse.sh builds SuiteSparse without OpenMP or Fortran
      # (see the script for why), once per runner/container, before any
      # Python build.  jax comes from pyproject's [build-system] pin (the
      # build is isolated), so nothing is pip-installed here.
      CIBW_BEFORE_ALL_MACOS: bash ci/build_suitesparse.sh
      CIBW_BEFORE_ALL_LINUX: bash ci/build_suitesparse.sh
      CIBW_ENVIRONMENT_MACOS: >
        SKBUILD_CMAKE_ARGS="-DCMAKE_PREFIX_PATH=/tmp/suitesparse"
      # SuiteSparse installs to lib64 on EL; auditwheel needs to find it.
      CIBW_ENVIRONMENT_LINUX: >
        SKBUILD_CMAKE_ARGS="-DCMAKE_PREFIX_PATH=/tmp/suitesparse"
        LD_LIBRARY_PATH="/tmp/suitesparse/lib64:/tmp/suitesparse/lib:$LD_LIBRARY_PATH"

      # ── Every platform: test the repaired wheel before it can publish ─────
      # Fails on a bundled OpenMP/Fortran runtime and checks a solve and a
      # second derivative, then runs the autodiff test module.
      CIBW_TEST_REQUIRES: pytest scipy
      CIBW_TEST_COMMAND: >
        python {project}/ci/check_wheel.py &&
        pytest -q {project}/tests/test_higher_order_ad.py

      # ── Windows ────────────────────────────────────────────────────────────
      # CHOLMOD (from SuiteSparse) isn't preinstalled here either. vcpkg
      # ships preinstalled on GitHub-hosted Windows runners, so use it. The
      # umbrella `suitesparse` port only pulls in CHOLMOD's partition module
      # by default -- sparsax needs Modify (cholmod_updown) too, which vcpkg
      # gates behind its `gpl` feature since Modify/MatrixOps/Supernodal are
      # GPL-licensed (this also pulls in MatrixOps and Supernodal, which
      # apt/Homebrew's suitesparse packages build unconditionally but vcpkg
      # treats as opt-in). UMFPACK is GPL as well and comes in under the same
      # `gpl` feature; on every other platform it ships in the same
      # suitesparse / suitesparse-devel / libsuitesparse-dev package that
      # supplies CHOLMOD and KLU, so no separate install step is needed. A
      # missing-UMFPACK configure error points here first.
      #
      # vcpkg's internal msys2 bootstrap hardcodes specific msys2 package
      # versions (e.g. autoconf2.71-2.71-3-any) that have been removed from
      # the msys2 mirrors (404 on all mirrors). The runner's preinstalled
      # vcpkg is at a stale commit; updating vcpkg itself picks up the
      # corrected package pins (e.g. autoconf2.71-2.71-4-any).
      CIBW_BEFORE_BUILD_WINDOWS: >
        pip install delvewheel &&
        vcpkg install "suitesparse[gpl]:x64-windows"
      CIBW_ENVIRONMENT_WINDOWS: >
        CMAKE_PREFIX_PATH="C:/vcpkg/installed/x64-windows"
      # --add-path tells delvewheel where to find the CHOLMOD DLLs to bundle,
      # since the vcpkg bin dir isn't on PATH by default.
      CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >
        delvewheel repair -w {dest_dir} --add-path C:\vcpkg\installed\x64-windows\bin {wheel}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # setuptools-scm needs tags

      # Update the runner's preinstalled vcpkg to pick up fixed msys2
      # package pins (the stale commit has autoconf2.71-2.71-3-any which
      # is 404 on all msys2 mirrors). Must happen before cibuildwheel
      # because CIBW_BEFORE_BUILD runs in a subprocess where drive
      # switching and env vars don't work reliably.
      - name: Update vcpkg (Windows only)
        if: matrix.os == 'windows-2022'
        shell: cmd
        run: |
          cd /d C:\vcpkg
          git fetch origin
          git checkout -B master origin/master
          .\bootstrap-vcpkg.bat -disableMetrics

      # Enable QEMU for Linux aarch64 cross-compilation.
      - name: Set up QEMU (Linux aarch64 only)
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build wheels
        # v2.x predates CPython 3.14, so the cp314-* selector above matched
        # nothing and 3.14 wheels were silently never built.
        uses: pypa/cibuildwheel@v4.2.1
        with:
          output-dir: wheelhouse

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm needs tags
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist --outdir wheelhouse
      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: wheelhouse/*.tar.gz

  publish:
    name: Publish to PyPI and create release
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    # Runs on any tag. test-* tags build+artifact only (no publish step fires).
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # v1.2.3a1 / v1.2.3b2 / v1.2.3rc1 → TestPyPI
      - name: Publish pre-release to TestPyPI
        if: |
          startsWith(github.ref_name, 'v') &&
          (contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc'))
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

      # v1.2.3 (clean) → real PyPI
      - name: Publish release to PyPI
        if: |
          startsWith(github.ref_name, 'v') &&
          !contains(github.ref_name, 'a') &&
          !contains(github.ref_name, 'b') &&
          !contains(github.ref_name, 'rc')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      # GitHub Release for any v* tag; marked pre-release when applicable
      - name: Create GitHub Release
        if: startsWith(github.ref_name, 'v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}